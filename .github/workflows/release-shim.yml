name: Release the selfiles shim

# The `selfiles` name on PyPI, published from `shim/`. Separate from
# `release.yml` because it is a different distribution with a version of its
# own: `SELlib` releases on `v*`, this one on `selfiles-v*`, and the two tag
# patterns cannot match each other.
#
# It should run approximately once, ever. `selfiles` 1.1.2 is a forwarder to
# `SELlib`; there is nothing in it to fix, and a second release would only mean
# the forwarding itself was wrong.
#
# ONE-TIME SETUP, on PyPI: the `selfiles` project already exists and already
# has a trusted publisher -- one that names the repository `selfiles`, which
# no longer exists under that name. Renaming a GitHub repository does NOT
# update a publisher, so at
# https://pypi.org/manage/project/selfiles/settings/publishing/ the old
# publisher has to be replaced with owner `GuilhermeMarini`, repository
# `sellib`, workflow `release-shim.yml`. Without it the upload fails with
# `invalid-publisher`.

on:
  push:
    tags: ["selfiles-v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag and the shim's version must agree
        run: |
          python - <<'PY'
          import os, pathlib, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("selfiles-v")
          meta = tomllib.loads(pathlib.Path("shim/pyproject.toml").read_text())
          version = meta["project"]["version"]
          if tag != version:
              sys.exit(f"::error::tag selfiles-v{tag} != shim version {version}")
          print(f"selfiles-v{tag} agrees with shim/pyproject.toml")
          PY

      - name: Install
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: |
          rm -rf shim/dist
          python -m build shim/
          python -m twine check shim/dist/*

      - name: It must forward to the real package, not carry a copy of it
        # The failure this guards is a shim that vendors the library instead
        # of depending on it: two copies of `rdb.py` in one process means two
        # registries and two extraction caches, disagreeing silently. The
        # wheel must contain the forwarder and nothing else.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("shim/dist/*.whl")[0]).namelist()
          py = [n for n in names if n.endswith(".py")]
          if py != ["selfiles/__init__.py"]:
              sys.exit(f"::error::the shim wheel carries more than the forwarder: {py}")
          print("the wheel carries only selfiles/__init__.py")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: shim/dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "selfiles $GITHUB_REF_NAME (forwarder to SELlib)" \
            --notes "\`selfiles\` is now \`SELlib\`. This release only forwards \`import selfiles\` to \`import sellib\`; see the SELlib releases for real changes." \
            shim/dist/*
